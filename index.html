    <h3>Play: Snake</h3>
    <canvas id="snake" width="640" height="320"></canvas>
    <div style="display:flex;gap:8px;align-items:center;margin-top:8px">
      <button id="start" class="btn">Start</button>
      <button id="stop" class="btn" style="background:#ff6b6b">Stop</button>
      <div style="margin-left:auto" class="muted">Score: <span id="score">0</span></div>

    <h3 style="margin-top:18px">Tic-Tac-Toe</h3>
    <div id="ttt" style="display:grid;grid-template-columns:repeat(3,80px);gap:8px">
      <button class="cell" style="height:80px;font-size:24px"></button><button class="cell" style="height:80px;font-size:24px"></button><button class="cell" style="height:80px;font-size:24px"></button><button class="cell" style="height:80px;font-size:24px"></button><button class="cell" style="height:80px;font-size:24px"></button><button class="cell" style="height:80px;font-size:24px"></button><button class="cell" style="height:80px;font-size:24px"></button><button class="cell" style="height:80px;font-size:24px"></button><button class="cell" style="height:80px;font-size:24px"></button>
    </div>
  </div>

<script>
// Snake
const canvas=document.getElementById('snake');const ctx=canvas.getContext('2d');
const grid=20;const cols=Math.floor(canvas.width/grid);const rows=Math.floor(canvas.height/grid);
let snake,food,dir,score,loop;
function reset(){snake=[{x:Math.floor(cols/2),y:Math.floor(rows/2)}];dir={x:1,y:0};placeFood();score=0;document.getElementById('score').textContent=score;}
function placeFood(){food={x:Math.floor(Math.random()*cols),y:Math.floor(Math.random()*rows)};if(snake.some(s=>s.x===food.x&&s.y===food.y))placeFood();}
function draw(){ctx.fillStyle='#071024';ctx.fillRect(0,0,canvas.width,canvas.height);ctx.fillStyle='#E06AF6';ctx.fillRect(food.x*grid,food.y*grid,grid-1,grid-1);snake.forEach((s,i)=>{ctx.fillStyle=i===0?'#7AF':'#4fa';ctx.fillRect(s.x*grid,s.y*grid,grid-1,grid-1)});}
function step(){const head={x:(snake[0].x+dir.x+cols)%cols,y:(snake[0].y+dir.y+rows)%rows};if(snake.some(s=>s.x===head.x&&s.y===head.y)){cancelAnimationFrame(loop);alert('Game over! Score: '+score);return}snake.unshift(head);if(head.x===food.x&&head.y===food.y){score++;document.getElementById('score').textContent=score;placeFood();}else snake.pop();draw();loop=requestAnimationFrame(()=>setTimeout(step,100));}
window.addEventListener('keydown',e=>{if(e.key==='ArrowUp'&&dir.y!==1)dir={x:0,y:-1};if(e.key==='ArrowDown'&&dir.y!==-1)dir={x:0,y:1};if(e.key==='ArrowLeft'&&dir.x!==1)dir={x:-1,y:0};if(e.key==='ArrowRight'&&dir.x!==-1)dir={x:1,y:0};});
document.getElementById('start').onclick=()=>{reset();step();canvas.focus();};
document.getElementById('stop').onclick=()=>{cancelAnimationFrame(loop);};
// TTT
const cells=document.querySelectorAll('#ttt .cell');let board=Array(9).fill(null);let turn='X';
function render(){cells.forEach((c,i)=>c.textContent=board[i]||'');}
function check(){const wins=[[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];for(let w of wins){const[a,b,c]=w;if(board[a]&&board[a]===board[b]&&board[a]===board[c])return board[a];}if(board.every(Boolean))return 'Draw';return null;}
cells.forEach((c,i)=>c.addEventListener('click',()=>{if(board[i])return;board[i]=turn;const w=check();if(w){setTimeout(()=>alert(w==='Draw'?'Draw!':w+' wins!'),50);board=Array(9).fill(null);}else{turn=turn==='X'?'O':'X';}render();}));
render();
</script>
